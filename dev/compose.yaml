# Dev Stack - Claude Dev (Claude Code remote-control) + Paseo (parallel agents)
# Usage: ./nova.sh up dev   (or: docker compose -f dev/compose.yaml up -d)
# Requires .env file for: GH_TOKEN, NOVA_DOMAIN, NOVA_HOSTNAME, TZ, PASEO_PASSWORD
# NOTE: `up`/`update` do NOT rebuild build: services. Use ./nova.sh recreate dev <svc>.

name: dev

networks:
  traefik_default:
    external: true
    name: "traefik_default"
  socket_proxy:
    external: true
    name: "socket_proxy"

services:

  # Claude Code running `claude remote-control` 24/7. Drive it from the Claude
  # mobile app or claude.ai/code, where it appears as an online session named
  # ${CLAUDE_DEV_SESSION_NAME}. Deliberately NO ports and NO Traefik router:
  # remote-control is outbound-only (HTTPS to api.anthropic.com), so there is
  # nothing to route and no listener to protect.
  #
  # Auth is a ONE-TIME interactive OAuth login — API keys and setup-token
  # tokens are not supported by remote-control. On first boot the container
  # logs print the one-time login command. Details: context/docker-access.md.
  claude-dev:
    build: "../claude-dev"
    cap_drop:
      - "AUDIT_CONTROL"
      - "BLOCK_SUSPEND"
      - "DAC_READ_SEARCH"
      - "IPC_LOCK"
      - "IPC_OWNER"
      - "LEASE"
      - "LINUX_IMMUTABLE"
      - "MAC_ADMIN"
      - "MAC_OVERRIDE"
      - "NET_ADMIN"
      - "NET_BROADCAST"
      - "SYSLOG"
      - "SYS_ADMIN"
      - "SYS_BOOT"
      - "SYS_MODULE"
      - "SYS_NICE"
      - "SYS_PACCT"
      - "SYS_PTRACE"
      - "SYS_RAWIO"
      - "SYS_RESOURCE"
      - "SYS_TIME"
      - "SYS_TTY_CONFIG"
      - "WAKE_ALARM"
    container_name: "claude-dev"
    environment:
      - "GH_TOKEN=${GH_TOKEN}"
      # Git talks to GitHub over HTTPS only, authenticated by GH_TOKEN via the
      # `gh auth git-credential` helper in the mounted .gitconfig. The checkouts
      # in /repos keep their git@github.com: remotes (the volume is shared with
      # kandev); these rewrite them to HTTPS inside this container only. There
      # are deliberately no SSH keys in here — see the volumes note below.
      - "GIT_CONFIG_COUNT=2"
      - "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
      - "GIT_CONFIG_VALUE_0=git@github.com:"
      - "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
      - "GIT_CONFIG_VALUE_1=ssh://git@github.com/"
      - "TZ=${TZ}"
      - "IS_SANDBOX=1"
      - "DOCKER_HOST=tcp://socket-proxy:2375"
      - "CLAUDE_DEV_SESSION_NAME=${CLAUDE_DEV_SESSION_NAME:-nova}"
      - "CLAUDE_DEV_PERMISSION_MODE=${CLAUDE_DEV_PERMISSION_MODE:-acceptEdits}"
      - "CLAUDE_DEV_REPOS=${CLAUDE_DEV_REPOS:-}"
      - "CLAUDE_DEV_EXTRA_ARGS=${CLAUDE_DEV_EXTRA_ARGS:-}"
      - "CLAUDE_DEV_ROOT_SESSION_WATCHDOG=${CLAUDE_DEV_ROOT_SESSION_WATCHDOG:-true}"
      - "CLAUDE_DEV_WATCHDOG_INTERVAL=${CLAUDE_DEV_WATCHDOG_INTERVAL:-60}"
      - "CLAUDE_DEV_WATCHDOG_COOLDOWN=${CLAUDE_DEV_WATCHDOG_COOLDOWN:-600}"
    healthcheck:
      # Logic lives in the image (claude-dev/healthcheck.sh) rather than inline:
      # it needs $(...) and quoting that compose interpolation would mangle.
      # Healthy only when every server the entrypoint started is still alive.
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    hostname: "${NOVA_HOSTNAME}"
    labels:
      # No traefik.* labels — nothing to route.
      homepage.group: "Development"
      homepage.name: "Claude Dev"
      homepage.icon: "mdi-robot"
      homepage.href: "https://claude.ai/code"
      homepage.description: "Claude Code Remote Control on nova"
      wud.watch: "false"  # locally-built image; rebuild via `./nova.sh recreate dev claude-dev`
    networks:
      - "traefik_default"
      - "socket_proxy"
    restart: "unless-stopped"
    stdin_open: true
    tty: true
    volumes:
      - "vibe-kanban-repos:/repos"
      - "claude-dev-claude:/root/.claude"
      # Every named volume's contents, read-only, for log/config inspection.
      # Contents live at /mnt/volumes/<volume>/_data/... — note the _data.
      - "/var/lib/docker/volumes:/mnt/volumes:ro"
      # Torrent downloads, read-only. These live on their own LVM volume rather than in a
      # named Docker volume, so they do NOT appear under /mnt/volumes. Note there is no
      # _data segment here: contents are at /mnt/downloads/qbittorrent/<torrent>/...
      - "/srv/downloads:/mnt/downloads:ro"
      # nova.sh run logs from the *live* host checkout — note that is NOT the same
      # tree as /repos/nova-config, which is a separate source checkout with no .env.
      # Covers interactive runs plus the nova-heal and nova-reconcile timers.
      # Tail with: tail -200 /mnt/nova-logs/current.log
      - "${NOVA_CONFIG_PATH}/logs:/mnt/nova-logs:ro"
      # Plex Media Server logs, read-only. Plex's /config is a bind mount on
      # /data1 — not a named volume — so it is NOT covered by /mnt/volumes above.
      # Only the Logs subdir is mounted: the rest of /config holds Preferences.xml
      # (server token) and the library databases, which have no business in here.
      # Tail with: tail -200 "/mnt/plex-logs/Plex Media Server.log"
      - "/data1/plex_config/plex_config/_data/Library/Application Support/Plex Media Server/Logs:/mnt/plex-logs:ro"
      # NEVER mount the host's ~/.ssh here. It used to be (for git over SSH), and
      # it held a key in koonan's authorized_keys: with host sshd reachable on
      # the bridge gateway, that was a full shell as koonan (docker, sudo, lxd
      # groups) — root-equivalent, and a bypass of the read-only socket proxy.
      # Git uses HTTPS instead (GIT_CONFIG_* above).
      - "/home/koonan/.gitconfig:/root/.gitconfig:ro"

  # Paseo: self-hosted daemon + web UI that runs coding agents (Claude Code,
  # Codex, OpenCode, Copilot CLI, Antigravity) in parallel, each in its own git
  # worktree. Reach it at paseo.${NOVA_DOMAIN} in a
  # browser, or from the Paseo mobile/desktop apps as a direct connection
  # (host paseo.${NOVA_DOMAIN}, port 443, SSL on) with PASEO_PASSWORD.
  #
  # Deliberately NO Authelia: the native apps authenticate with the daemon
  # password and cannot complete a forward-auth browser login. PASEO_PASSWORD
  # guards the API and WebSocket; the static web UI files are public. The route
  # is internet-facing, so the password must be long and random.
  #
  # The Paseo relay is pinned off: the only way in is this Traefik route.
  # Agent logins are a one-time step from the HOST (claude-dev cannot exec).
  # Every provider's account setup, and its no-surprise-billing settings, are in
  # context/stacks.md § paseo.
  paseo:
    build: "../paseo"
    cap_drop:
      - "AUDIT_CONTROL"
      - "BLOCK_SUSPEND"
      - "DAC_READ_SEARCH"
      - "IPC_LOCK"
      - "IPC_OWNER"
      - "LEASE"
      - "LINUX_IMMUTABLE"
      - "MAC_ADMIN"
      - "MAC_OVERRIDE"
      - "NET_ADMIN"
      - "NET_BROADCAST"
      - "SYSLOG"
      - "SYS_ADMIN"
      - "SYS_BOOT"
      - "SYS_MODULE"
      - "SYS_NICE"
      - "SYS_PACCT"
      - "SYS_PTRACE"
      - "SYS_RAWIO"
      - "SYS_RESOURCE"
      - "SYS_TIME"
      - "SYS_TTY_CONFIG"
      - "WAKE_ALARM"
    container_name: "paseo"
    environment:
      - "TZ=${TZ}"
      - "PASEO_PASSWORD=${PASEO_PASSWORD:?set PASEO_PASSWORD in .env}"
      # Without this the daemon answers 403 to any request by DNS name.
      - "PASEO_HOSTNAMES=paseo.${NOVA_DOMAIN}"
      - "PASEO_RELAY_ENABLED=false"
      - "GH_TOKEN=${GH_TOKEN}"
      # Copilot CLI reads GH_TOKEN before its own login, and rejects the classic
      # PAT that GH_TOKEN holds. COPILOT_GITHUB_TOKEN outranks GH_TOKEN, so a
      # fine-grained PAT here (Copilot Requests permission only) is what it uses.
      - "COPILOT_GITHUB_TOKEN=${COPILOT_GITHUB_TOKEN:-}"
      # Same HTTPS-only git as claude-dev: GH_TOKEN via the gh credential helper
      # in the mounted .gitconfig, with SSH-style remotes rewritten to HTTPS.
      - "GIT_CONFIG_COUNT=2"
      - "GIT_CONFIG_KEY_0=url.https://github.com/.insteadOf"
      - "GIT_CONFIG_VALUE_0=git@github.com:"
      - "GIT_CONFIG_KEY_1=url.https://github.com/.insteadOf"
      - "GIT_CONFIG_VALUE_1=ssh://git@github.com/"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:6767/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.http.routers.paseo.rule: "Host(`paseo.${NOVA_DOMAIN}`)"
      traefik.http.routers.paseo.entrypoints: "websecure"
      traefik.http.routers.paseo.tls: "true"
      # Rate limit only — no Authelia (see above). Defence-in-depth against
      # password brute-forcing on a public route.
      traefik.http.routers.paseo.middlewares: "paseo-ratelimit@file"
      traefik.http.services.paseo.loadbalancer.server.port: "6767"
      homepage.group: "Development"
      homepage.name: "Paseo"
      homepage.icon: "mdi-robot-outline"
      homepage.href: "https://paseo.${NOVA_DOMAIN}"
      homepage.description: "Parallel Claude Code / Codex agents in git worktrees"
      wud.watch: "false"  # locally-built image; rebuild via `./nova.sh recreate dev paseo`
    networks:
      - "traefik_default"
    restart: "unless-stopped"
    volumes:
      # Daemon state, agent sessions, and the Claude/Codex OAuth credentials.
      - "paseo_home:/home/paseo"
      # Paseo's own checkouts. Deliberately NOT vibe-kanban-repos: that tree is
      # shared by claude-dev and kandev, and Paseo's worktrees/branches would
      # pile up in it. Clone repos in from the Paseo UI or terminal.
      - "paseo_workspace:/workspace"
      # Never mount ~/.ssh here either — see the claude-dev note above.
      - "/home/koonan/.gitconfig:/home/paseo/.gitconfig:ro"

volumes:

  # /repos — the checkouts claude-dev serves. The name is historical (it was
  # vibe-kanban's workspace) and it stays external: the kandev project, which
  # lives outside this repo, mounts the same volume. Never recreate or rename it.
  vibe-kanban-repos:
    external: true

  # claude-dev's own Claude Code config + OAuth credentials.
  claude-dev-claude:

  # Paseo daemon state + agent credentials, and Paseo's own checkouts.
  # Create before first up (or run ./nova.sh init):
  #   docker volume create paseo_home && docker volume create paseo_workspace
  paseo_home:
    external: true
  paseo_workspace:
    external: true

# Dev Stack - Claude Dev (Claude Code remote-control)
# Usage: ./nova.sh up dev   (or: docker compose -f dev/compose.yaml up -d)
# Requires .env file for: GH_TOKEN, NOVA_DOMAIN, NOVA_HOSTNAME, TZ
# NOTE: `up`/`update` do NOT rebuild build: services. Use ./nova.sh recreate dev <svc>.

name: dev

networks:
  traefik_default:
    external: true
    name: "traefik_default"
  socket_proxy:
    external: true
    name: "socket_proxy"

services:

  # Claude Code running `claude remote-control` 24/7. Drive it from the Claude
  # mobile app or claude.ai/code, where it appears as an online session named
  # ${CLAUDE_DEV_SESSION_NAME}. Deliberately NO ports and NO Traefik router:
  # remote-control is outbound-only (HTTPS to api.anthropic.com), so there is
  # nothing to route and no listener to protect.
  #
  # Auth is a ONE-TIME interactive OAuth login — API keys and setup-token
  # tokens are not supported by remote-control. On first boot the container
  # logs print the one-time login command. Details: context/docker-access.md.
  claude-dev:
    build: "../claude-dev"
    cap_drop:
      - "AUDIT_CONTROL"
      - "BLOCK_SUSPEND"
      - "DAC_READ_SEARCH"
      - "IPC_LOCK"
      - "IPC_OWNER"
      - "LEASE"
      - "LINUX_IMMUTABLE"
      - "MAC_ADMIN"
      - "MAC_OVERRIDE"
      - "NET_ADMIN"
      - "NET_BROADCAST"
      - "SYSLOG"
      - "SYS_ADMIN"
      - "SYS_BOOT"
      - "SYS_MODULE"
      - "SYS_NICE"
      - "SYS_PACCT"
      - "SYS_PTRACE"
      - "SYS_RAWIO"
      - "SYS_RESOURCE"
      - "SYS_TIME"
      - "SYS_TTY_CONFIG"
      - "WAKE_ALARM"
    container_name: "claude-dev"
    environment:
      - "GH_TOKEN=${GH_TOKEN}"
      - "TZ=${TZ}"
      - "IS_SANDBOX=1"
      - "DOCKER_HOST=tcp://socket-proxy:2375"
      - "CLAUDE_DEV_SESSION_NAME=${CLAUDE_DEV_SESSION_NAME:-nova}"
      - "CLAUDE_DEV_PERMISSION_MODE=${CLAUDE_DEV_PERMISSION_MODE:-acceptEdits}"
      - "CLAUDE_DEV_REPOS=${CLAUDE_DEV_REPOS:-}"
      - "CLAUDE_DEV_EXTRA_ARGS=${CLAUDE_DEV_EXTRA_ARGS:-}"
      - "CLAUDE_DEV_ROOT_SESSION_WATCHDOG=${CLAUDE_DEV_ROOT_SESSION_WATCHDOG:-true}"
      - "CLAUDE_DEV_WATCHDOG_INTERVAL=${CLAUDE_DEV_WATCHDOG_INTERVAL:-60}"
      - "CLAUDE_DEV_WATCHDOG_COOLDOWN=${CLAUDE_DEV_WATCHDOG_COOLDOWN:-600}"
    healthcheck:
      # Logic lives in the image (claude-dev/healthcheck.sh) rather than inline:
      # it needs $(...) and quoting that compose interpolation would mangle.
      # Healthy only when every server the entrypoint started is still alive.
      test: ["CMD", "/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    hostname: "${NOVA_HOSTNAME}"
    labels:
      # No traefik.* labels — nothing to route.
      homepage.group: "Development"
      homepage.name: "Claude Dev"
      homepage.icon: "mdi-robot"
      homepage.href: "https://claude.ai/code"
      homepage.description: "Claude Code Remote Control on nova"
      wud.watch: "false"  # locally-built image; rebuild via `./nova.sh recreate dev claude-dev`
    networks:
      - "traefik_default"
      - "socket_proxy"
    restart: "unless-stopped"
    stdin_open: true
    tty: true
    volumes:
      - "vibe-kanban-repos:/repos"
      - "claude-dev-claude:/root/.claude"
      # Every named volume's contents, read-only, for log/config inspection.
      # Contents live at /mnt/volumes/<volume>/_data/... — note the _data.
      - "/var/lib/docker/volumes:/mnt/volumes:ro"
      # Torrent downloads, read-only. These live on their own LVM volume rather than in a
      # named Docker volume, so they do NOT appear under /mnt/volumes. Note there is no
      # _data segment here: contents are at /mnt/downloads/qbittorrent/<torrent>/...
      - "/srv/downloads:/mnt/downloads:ro"
      # nova.sh run logs from the *live* host checkout — note that is NOT the same
      # tree as /repos/nova-config, which is a separate source checkout with no .env.
      # Covers interactive runs plus the nova-heal and nova-reconcile timers.
      # Tail with: tail -200 /mnt/nova-logs/current.log
      - "${NOVA_CONFIG_PATH}/logs:/mnt/nova-logs:ro"
      # Plex Media Server logs, read-only. Plex's /config is a bind mount on
      # /data1 — not a named volume — so it is NOT covered by /mnt/volumes above.
      # Only the Logs subdir is mounted: the rest of /config holds Preferences.xml
      # (server token) and the library databases, which have no business in here.
      # Tail with: tail -200 "/mnt/plex-logs/Plex Media Server.log"
      - "/data1/plex_config/plex_config/_data/Library/Application Support/Plex Media Server/Logs:/mnt/plex-logs:ro"
      - "/home/koonan/.ssh:/root/.ssh:ro"
      - "/home/koonan/.gitconfig:/root/.gitconfig:ro"

volumes:

  # /repos — the checkouts claude-dev serves. The name is historical (it was
  # vibe-kanban's workspace) and it stays external: the kandev project, which
  # lives outside this repo, mounts the same volume. Never recreate or rename it.
  vibe-kanban-repos:
    external: true

  # claude-dev's own Claude Code config + OAuth credentials.
  claude-dev-claude:

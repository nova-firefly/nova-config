# Hermes Agent Stack - Self-hosted NousResearch agent with web dashboard
# Usage: ./nova.sh up hermes   (or: docker compose -f hermes/compose.yaml up -d)
# Requires .env file for: NOVA_DOMAIN, TZ, PUID, PGID,
#   HERMES_DASHBOARD_USERNAME, HERMES_DASHBOARD_PASSWORD, HERMES_DASHBOARD_SECRET,
#   HERMES_OPENROUTER_API_KEY, HERMES_GITHUB_TOKEN,
#   HERMES_SIGNAL_ACCOUNT, HERMES_SIGNAL_ALLOWED_USERS
#
# Prereqs:
#   1. Create the volumes:  docker volume create hermes_data && docker volume create hermes_signal_data
#   2. Register the bot's Signal number (context/stacks.md → hermes → Signal)
#   3. `./nova.sh up hermes` (or via Dockge)
#
# One container, upstream image. `gateway run` is supervised by s6-overlay inside the
# image, and HERMES_DASHBOARD=1 brings the web dashboard up as a sibling s6 service in
# the same container (upstream's supported layout — a separate dashboard container
# needs a shared PID namespace with the gateway for liveness detection).
#
# Networking deviation from upstream:
#   Upstream compose uses network_mode: host. We drop that so the container sits on
#   `traefik_default` for label-based routing and on `socket_proxy` for read-only
#   Docker access. The dashboard binds 0.0.0.0:9119 inside the container — never
#   publish the port directly.
#
# Auth is two layers: Authelia (2FA) at the Traefik edge, then Hermes' own
# username/password gate. Upstream made the dashboard gate mandatory on non-loopback
# binds after the June 2026 exposed-dashboard campaign (`--insecure` is now a no-op),
# so the dashboard fails closed at startup if the basic-auth vars are unset.

name: hermes

networks:
  traefik_default:
    external: true
    name: "traefik_default"
  socket_proxy:
    external: true
    name: "socket_proxy"
  # hermes <-> signal-cli only. The signal-cli HTTP daemon has no auth, so nothing
  # else may join this network.
  signal:
    name: "hermes_signal"

services:

  hermes:
    container_name: "hermes"
    image: "nousresearch/hermes-agent:stable"
    command: ["gateway", "run"]
    environment:
      - "TZ=${TZ}"
      - "HERMES_UID=${PUID}"
      - "HERMES_GID=${PGID}"
      - "DOCKER_HOST=tcp://socket-proxy:2375"
      - "HERMES_DASHBOARD=1"
      # Must match the Traefik host — the dashboard rejects requests whose Host
      # header is neither the bind address nor the declared public URL.
      - "HERMES_DASHBOARD_PUBLIC_URL=https://hermes.${NOVA_DOMAIN}"
      - "HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USERNAME}"
      - "HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD}"
      # Signs session cookies; without it every restart logs you out.
      - "HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET}"
      # Model: MiniMax M3 via OpenRouter, pinned to US-hosted providers in
      # managed/config.yaml (mounted as Hermes' read-only managed scope). The spend cap
      # is the credit limit on this OpenRouter key; only this provider is wired.
      - "OPENROUTER_API_KEY=${HERMES_OPENROUTER_API_KEY}"
      # Fine-grained PAT (kjsb25): Issues RW, Contents/PRs/Actions read on repos with
      # .github/workflows/claude.yml. Used by the claude-handoff skill to file
      # "@claude" issues that the Claude Code Action picks up. No code write access.
      - "GH_TOKEN=${HERMES_GITHUB_TOKEN}"
      # Signal via the signal-cli sidecar below. ACCOUNT is the bot's own number;
      # ALLOWED_USERS is YOUR number (E.164) — everyone else gets no reply.
      - "SIGNAL_HTTP_URL=http://signal-cli:8080"
      - "SIGNAL_ACCOUNT=${HERMES_SIGNAL_ACCOUNT}"
      - "SIGNAL_ALLOWED_USERS=${HERMES_SIGNAL_ALLOWED_USERS}"
      - "SIGNAL_HOME_CHANNEL=${HERMES_SIGNAL_ALLOWED_USERS}"
    healthcheck:
      # /api/status is on the dashboard's public allowlist (no auth, no secrets).
      test: ["CMD-SHELL", "curl -fsS http://localhost:9119/api/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    labels:
      traefik.enable: "true"
      traefik.http.routers.hermes.rule: "Host(`hermes.${NOVA_DOMAIN}`)"
      traefik.http.routers.hermes.entrypoints: "websecure"
      traefik.http.routers.hermes.tls: "true"
      traefik.http.routers.hermes.middlewares: "authelia@file"
      traefik.http.services.hermes.loadbalancer.server.port: "9119"
      homepage.group: "Development"
      homepage.name: "Hermes Agent"
      homepage.icon: "mdi-robot"
      homepage.href: "https://hermes.${NOVA_DOMAIN}"
      homepage.description: "Self-hosted AI agent (Nous Research)"
      wud.watch: "true"
      wud.watch.digest: "true"
      wud.trigger.include: "discord.notify"
    depends_on:
      - "signal-cli"
    networks:
      - "traefik_default"
      - "socket_proxy"
      - "signal"
    restart: "unless-stopped"
    # Hardening. The image boots as root under s6-overlay: cont-init does usermod +
    # chown/chmod on /opt/data and the s6 supervise dirs, then drops to the `hermes`
    # user via s6-setuidgid (a setuid() syscall, not a setuid binary — so
    # no-new-privileges is safe). s6-supervise (root) signals the hermes-owned
    # services, hence KILL. read_only rootfs is not possible: usermod rewrites
    # /etc/passwd at boot.
    cap_drop:
      - "ALL"
    cap_add:
      - "CHOWN"
      - "DAC_OVERRIDE"
      - "FOWNER"
      - "SETUID"
      - "SETGID"
      - "KILL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 1024
    mem_limit: "4g"
    volumes:
      - "hermes_data:/opt/data"
      - "vibe-kanban-repos:/repos:ro"
      # Nova-maintained skills (claude-handoff). Read-only so the agent can't rewrite
      # its own instructions; registered via skills.external_dirs in managed/config.yaml.
      - "./skills:/opt/nova-skills:ro"
      # Managed scope: model, US-only provider routing and skills, pinned so the
      # dashboard/agent can't change them. Replaces any post-up `hermes config set`.
      - "./managed/config.yaml:/etc/hermes/config.yaml:ro"

  signal-cli:
    container_name: "hermes-signal-cli"
    image: "ghcr.io/asamk/signal-cli:0.14.9"
    # JSON-RPC + SSE over HTTP, which is what Hermes' Signal adapter speaks.
    command: ["--account", "${HERMES_SIGNAL_ACCOUNT}", "daemon", "--http", "0.0.0.0:8080"]
    environment:
      - "TZ=${TZ}"
    labels:
      wud.watch: "true"
      wud.tag.include: '^\d+\.\d+\.\d+$'
      wud.trigger.include: "discord.notify"
    networks:
      - "signal"
    restart: "unless-stopped"
    # Runs as the image's non-root signal-cli user; needs no capabilities.
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - "/tmp"
    pids_limit: 256
    mem_limit: "1g"
    volumes:
      # Signal identity keys + message store for the bot account. Back this up:
      # losing it means re-registering the number.
      - "hermes_signal_data:/var/lib/signal-cli"

volumes:
  hermes_data:
    external: true
  hermes_signal_data:
    external: true
  vibe-kanban-repos:
    external: true
